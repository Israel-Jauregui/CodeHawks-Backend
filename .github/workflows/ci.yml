name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check application and build Lambda
        run: npm run check

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Validate CloudFormation bootstrap
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.3
          cfn-lint infrastructure/bootstrap/template.yaml
          python infrastructure/bootstrap/check_policy_invariants.py

      - name: Initialize Terraform without a state backend
        run: terraform -chdir=infrastructure init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate
