name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check application and build Lambda
        run: npm run check

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Initialize Terraform without a state backend
        run: terraform -chdir=infrastructure init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate

